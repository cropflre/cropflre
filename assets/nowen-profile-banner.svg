<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">CROPFLRE | NOWEN OPEN SOURCE LAB</title>
<desc id="desc">A dark midnight-blue developer console with soft cyan and violet gradients, a Nowen node mark, and open-source skill cards.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#080F1E"/><stop offset=".56" stop-color="#10192D"/><stop offset="1" stop-color="#22143C"/></linearGradient>
  <linearGradient id="accent" x1="76" y1="0" x2="765" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#EAFAFF"/><stop offset=".45" stop-color="#84E3FF"/><stop offset="1" stop-color="#B99BFF"/></linearGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42CFFF"/><stop offset="1" stop-color="#A677FF"/></linearGradient>
  <linearGradient id="glass" x1="825" y1="45" x2="1136" y2="322" gradientUnits="userSpaceOnUse"><stop stop-color="#1C2B47"/><stop offset="1" stop-color="#151629"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1000 180) rotate(90) scale(270 320)" gradientUnits="userSpaceOnUse"><stop stop-color="#5341CB" stop-opacity=".32"/><stop offset="1" stop-color="#5341CB" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#96B4DB" stroke-opacity=".06"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="highlight"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
